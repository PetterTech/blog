{{ define "main" }}
<header class="list-head">
  <p class="overline"><span class="tiny-line"></span><a href="{{ .Parent.RelPermalink }}">{{ .Data.Singular | title }}</a> · {{ len .Pages }} {{ cond (eq (len .Pages) 1) "post" "posts" }}</p>
  <h1>{{ .Title }}</h1>
</header>
{{ partial "post-list.html" .Pages }}
{{ end }}
