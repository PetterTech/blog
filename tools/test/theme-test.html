<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Blog browser test</title></head>
<body>
<!-- Run with tools/test/run-browser-tests.sh: it serves public/ under /blog/ next to this file and loads it in
     headless Chrome with a DARK colour-scheme preference. Prints RESULT PASS/FAIL lines. -->
<pre id="out"></pre>
<iframe id="f" width="1200" height="900"></iframe>
<script>
const out = document.getElementById('out');
const log = (ok, name, detail = '') => { out.textContent += `RESULT ${ok ? 'PASS' : 'FAIL'}  ${name} ${detail}\n`; };
const wait = (ms) => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');
const load = (src) => new Promise(r => { f.addEventListener('load', r, { once: true }); f.src = src; });
const pages = [
  '/blog/',
  '/blog/about-2/',
  '/blog/index.php/2014/08/28/powercli-getting-vm-alarms/',                                   // images
  '/blog/index.php/2011/10/27/mass-import-of-users-in-active-directory-v2-powershell-time/',   // long code block
  '/blog/404.html',
];
(async () => {
  localStorage.setItem('theme', 'evil"><img src=x>');   // garbage must be ignored
  for (const p of pages) {
    await load(p);
    const w = f.contentWindow, d = f.contentDocument;
    for (let y = 0; y < d.body.scrollHeight; y += 700) { w.scrollTo(0, y); await wait(40); }   // lazy images
    await wait(800);
    await d.fonts.ready;
    const imgs = [...d.images].filter(i => getComputedStyle(i).display !== 'none');
    const broken = imgs.filter(i => !(i.complete && i.naturalWidth > 0)).map(i => i.getAttribute('src'));
    const failed = w.performance.getEntriesByType('resource').filter(e => e.responseStatus >= 400).map(e => e.name);
    log(d.documentElement.dataset.theme === 'dark', `${p} follows the system theme (dark)`, d.documentElement.dataset.theme);
    log(!!d.querySelector('meta[http-equiv="Content-Security-Policy"]'), `${p} CSP meta present`);
    log(broken.length === 0 && failed.length === 0, `${p} ${imgs.length} images and all resources loaded`, [...broken, ...failed].join(' '));
    log(d.fonts.check('800 20px Montserrat') && d.fonts.check('400 17px Montserrat') && d.fonts.check('14px "PT Mono"'), `${p} self-hosted fonts loaded`);
    if (p.includes('index.php')) log(d.querySelectorAll('.chroma').length > 0, `${p} code is highlighted`);
  }
  // theme toggle: remembered across pages, same localStorage key ("theme") as pettertech.com
  await load('/blog/');
  let d = f.contentDocument, root = d.documentElement;
  const btn = d.getElementById('theme-toggle');
  log(btn.getAttribute('aria-label') === 'Switch to light mode', 'toggle offers light mode');
  btn.click(); await wait(100);
  log(root.dataset.theme === 'light' && localStorage.getItem('theme') === 'light', 'click → light, stored as theme=light');
  log(getComputedStyle(d.querySelector('.logo-light')).display === 'block', 'black logo in light mode');
  await wait(400);
  log(getComputedStyle(root).getPropertyValue('--bg').trim() === '#f2f2f2', 'light tokens active (--bg #f2f2f2)');
  await load('/blog/index.php/2014/08/28/powercli-getting-vm-alarms/');
  d = f.contentDocument; root = d.documentElement;
  log(root.dataset.theme === 'light', 'light survives navigation (set before first paint)');
  d.getElementById('theme-toggle').click(); await wait(100);
  log(root.dataset.theme === 'dark' && localStorage.getItem('theme') === null, 'click → dark = system again, nothing stored');
  out.textContent += 'DONE\n';
})().catch(e => { out.textContent += 'RESULT FAIL  exception ' + e + '\nDONE\n'; });
</script>
</body>
</html>
