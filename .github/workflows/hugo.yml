# PetterTech/blog (Settings → Pages → Source: GitHub Actions) – builds the Hugo archive and deploys it to
# https://pettertech.com/blog/ on every push to main, or by hand.
# Hugo comes from the official release tarball, verified against the release's checksums file. Bump HUGO_VERSION
# by hand; Dependabot keeps the actions (pinned to commit SHAs, tag in the comment) up to date.
name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.169.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo extended ${{ env.HUGO_VERSION }} (checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict -
          mkdir -p hugo-bin
          tar -xzf "${tarball}" -C hugo-bin hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Build (fails on any Hugo warning)
        run: |
          hugo version
          hugo --minify --panicOnWarning

      - name: Check links, assets and CSP
        run: python3 tools/test/check_site.py public

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
